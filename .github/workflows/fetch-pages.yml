# Fetch JS-rendered pages (rendered HTML, screenshot, JSON responses) from a
# GitHub runner and push them to the auto/fetch branch for inspection.
name: fetch-pages

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated URLs"
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cp "$GITHUB_WORKSPACE/scripts/fetch_pages.mjs" /tmp/pw/
          node /tmp/pw/fetch_pages.mjs "$GITHUB_WORKSPACE/fetched" ${{ inputs.urls }}
      - name: Push to auto/fetch
        run: |
          git config user.name "elections-data-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B auto/fetch
          git add -f fetched
          git commit -m "fetch: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push -f origin auto/fetch
