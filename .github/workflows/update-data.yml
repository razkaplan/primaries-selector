# Scheduled data refresh: scrape polls, candidate lists and prediction-market
# odds, merge any changes to main via an auto-merged pull request (main is a
# protected branch), and redeploy the site so the pages stay current.
#
# The Vercel step needs a VERCEL_TOKEN repository secret
# (create at https://vercel.com/account/settings/tokens, add under
# Settings → Secrets and variables → Actions).
# PR creation needs "Allow GitHub Actions to create and approve pull requests"
# enabled under Settings → Actions → General.

name: update-data

on:
  schedule:
    - cron: "23 */6 * * *" # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scrapers
        run: |
          python3 scripts/scrape_elections.py
          python3 scripts/scrape_markets.py
          python3 scripts/build_sources.py

      - name: Sanity-check the fresh data
        # A source-site redesign that breaks parsing must fail the run, not
        # silently publish a shrunken dataset. Small legitimate shrinkage
        # (a withdrawn list, a corrected poll) passes.
        run: |
          python3 - <<'EOF'
          import json, subprocess, sys

          def counts(polls_raw, lists_raw):
              polls = json.loads(polls_raw)["polls"]
              lists = json.loads(lists_raw)
              return len(polls), sum(len(p["candidates"]) for p in lists)

          old = counts(
              subprocess.run(["git", "show", "HEAD:data/elections/polls.json"],
                             capture_output=True, text=True).stdout,
              subprocess.run(["git", "show", "HEAD:data/elections/party_lists.json"],
                             capture_output=True, text=True).stdout)
          new = counts(open("data/elections/polls.json").read(),
                       open("data/elections/party_lists.json").read())
          print(f"polls {old[0]} -> {new[0]}, candidates {old[1]} -> {new[1]}")
          if new[0] < old[0] - 5:
              sys.exit(f"ABORT: poll count dropped {old[0]} -> {new[0]}")
          if new[1] < old[1] * 0.9:
              sys.exit(f"ABORT: candidate count dropped {old[1]} -> {new[1]}")
          markets = json.load(open("data/elections/markets.json"))["markets"]
          if len(markets) < 1:
              sys.exit("ABORT: no prediction markets fetched")
          EOF

      - name: Merge data changes via auto-PR
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "elections-data-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data app/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
            exit 0
          fi
          STAMP="$(date -u '+%Y-%m-%d %H:%M') UTC"
          git checkout -B auto/data-refresh
          git commit -m "data: עדכון אוטומטי $STAMP"
          git push -f origin auto/data-refresh
          gh pr create --base main --head auto/data-refresh \
            --title "data: עדכון אוטומטי $STAMP" \
            --body "רענון דאטה מתוזמן: סקרים, רשימות מועמדים ושוקי חיזוי. נפתח ומוזג אוטומטית על ידי update-data.yml." \
            || echo "PR already open, reusing it"
          gh pr merge auto/data-refresh --squash --delete-branch
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Vercel
        if: steps.commit.outputs.changed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_Dum8ScuX0pc87iqUkTVHKM1z
          VERCEL_PROJECT_ID: prj_mIE0HVS1MmthnBPCWR7xW7p0zQQk
        working-directory: app
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN secret not set - data merged, site NOT redeployed"
            exit 0
          fi
          npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
