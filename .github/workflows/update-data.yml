# Scheduled data refresh: scrape polls, candidate lists and prediction-market
# odds, commit any changes, and redeploy the site so the pages stay current.
#
# The Vercel step needs a VERCEL_TOKEN repository secret
# (create at https://vercel.com/account/settings/tokens, add under
# Settings → Secrets and variables → Actions). Until it exists, data is
# still committed but the redeploy step is skipped with a warning.

name: update-data

on:
  schedule:
    - cron: "23 */6 * * *" # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scrapers
        run: |
          python3 scripts/scrape_elections.py
          python3 scripts/scrape_markets.py
          python3 scripts/build_sources.py

      - name: Commit data changes
        id: commit
        run: |
          git config user.name "elections-data-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data app/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
          else
            git commit -m "data: עדכון אוטומטי $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Vercel
        if: steps.commit.outputs.changed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_Dum8ScuX0pc87iqUkTVHKM1z
          VERCEL_PROJECT_ID: prj_mIE0HVS1MmthnBPCWR7xW7p0zQQk
        working-directory: app
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN secret not set - data committed, site NOT redeployed"
            exit 0
          fi
          npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
