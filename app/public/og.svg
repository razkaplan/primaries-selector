<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101CAA"/>
      <stop offset="1" stop-color="#2A38D7"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle oversized ballot-slip shape, right side -->
  <g opacity="0.08">
    <rect x="-140" y="90" width="520" height="640" rx="36" fill="#FFFFFF" transform="rotate(-9 120 410)"/>
  </g>

  <!-- ballot card, left side (RTL layout: card sits left, text right) -->
  <g transform="translate(88 150)">
    <rect x="0" y="0" width="330" height="330" rx="28" fill="#FFFFFF"/>
    <!-- checked rows -->
    <g font-family="Noto Sans Hebrew, Arial Hebrew, Arial" font-size="30" fill="#181a1f">
      <g transform="translate(42 66)">
        <rect x="0" y="-26" width="34" height="34" rx="9" fill="#2A38D7"/>
        <path d="M7 -9 L15 -1 L28 -19" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="56" y="-18" width="190" height="18" rx="9" fill="#E4E7F8"/>
      </g>
      <g transform="translate(42 138)">
        <rect x="0" y="-26" width="34" height="34" rx="9" fill="#2A38D7"/>
        <path d="M7 -9 L15 -1 L28 -19" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="56" y="-18" width="150" height="18" rx="9" fill="#E4E7F8"/>
      </g>
      <g transform="translate(42 210)">
        <rect x="0" y="-26" width="34" height="34" rx="9" fill="#D92731"/>
        <path d="M7 -9 L15 -1 L28 -19" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="56" y="-18" width="210" height="18" rx="9" fill="#E4E7F8"/>
      </g>
      <g transform="translate(42 282)">
        <rect x="0" y="-26" width="34" height="34" rx="9" fill="#FFFFFF" stroke="#C9CEE9" stroke-width="3"/>
        <rect x="56" y="-18" width="170" height="18" rx="9" fill="#E4E7F8"/>
      </g>
    </g>
  </g>

  <!-- headline block, right side, RTL -->
  <g font-family="Noto Sans Hebrew, Arial Hebrew, Arial" direction="rtl" text-anchor="start">
    <text x="1112" y="205" font-size="88" font-weight="900" fill="#FFFFFF">בוחרים בפריימריז</text>
    <text x="1112" y="285" font-size="40" font-weight="500" fill="#DDE1FB">מי ראוי לקול שלכם ברשימת הדמוקרטים?</text>
    <text x="1112" y="352" font-size="34" font-weight="400" fill="#B8BFF5">5 שאלות קצרות, דירוג אישי של 51 מועמדים,</text>
    <text x="1112" y="400" font-size="34" font-weight="400" fill="#B8BFF5">ופתק מאוזן מוכן להצבעה</text>
  </g>

  <!-- chips row -->
  <g font-family="Noto Sans Hebrew, Arial Hebrew, Arial" font-size="27" font-weight="700" text-anchor="middle">
    <rect x="877" y="448" width="235" height="56" rx="28" fill="#FFFFFF"/>
    <text x="994" y="485" fill="#101CAA">שקוף ומבוסס נתונים</text>
    <rect x="662" y="448" width="195" height="56" rx="28" fill="#D92731"/>
    <text x="759" y="485" fill="#FFFFFF">20.7.2026 הצבעה</text>
    <rect x="482" y="448" width="160" height="56" rx="28" fill="#FFFFFF" opacity="0.14"/>
    <text x="562" y="485" fill="#FFFFFF">כלי לא רשמי</text>
  </g>

  <!-- site url -->
  <text x="1112" y="575" font-family="Noto Sans Hebrew, Arial Hebrew, Arial" font-size="28" font-weight="500" fill="#8F99EE" text-anchor="end">elections.gtmascode.dev</text>
</svg>
